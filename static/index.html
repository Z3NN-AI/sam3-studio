<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM3 Studio</title>
<style>
:root {
  --bg: #111316; --panel: #1a1d22; --panel2: #23272e; --line: #30353e;
  --text: #e8eaed; --muted: #9aa0a8; --accent: #4f8cff; --danger: #e5484d; --ok: #2f9e5b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
button, .btn, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=text], input[type=number] { background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
input[type=number] { width: 70px; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
#stageWrap { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#stage { position: relative; display: flex; align-items: center; justify-content: center;
  overflow: hidden; min-height: 0; padding: 12px; }
#canvas { max-width: 100%; max-height: 100%; background: #000; border-radius: 6px;
  cursor: crosshair; display: none; }
#drop { position: absolute; inset: 24px; border: 2px dashed var(--line); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); text-align: center; padding: 20px; }
#drop.hover { border-color: var(--accent); color: var(--text); }
#player { display: none; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--panel); border-top: 1px solid var(--line); }
#seek { flex: 1; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  padding: 14px; display: flex; flex-direction: column; gap: 16px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 0 0 8px; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tools button { flex: 1; }
#count { font-size: 44px; font-weight: 700; line-height: 1; }
.counts div { display: flex; justify-content: space-between; padding: 2px 0; }
#objects { display: flex; flex-direction: column; gap: 4px; }
.obj { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
  background: var(--panel2); border: 1px solid transparent; }
.obj.absent { opacity: .5; }
.obj.hidden .sw { opacity: .2; }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.obj .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.obj button { padding: 2px 7px; font-size: 12px; }
#busy { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(20,22,26,.92); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 16px; min-width: 260px; z-index: 5; }
#bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
#bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 10px;
  display: none; max-width: 80vw; z-index: 10; align-items: center; gap: 12px; }
#toast.ok { background: var(--ok); }
#toast button { background: rgba(255,255,255,.2); border-color: transparent; color: #fff; padding: 4px 10px; }
.hint { font-size: 12px; color: var(--muted); }
kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
  padding: 0 5px; font-size: 11px; }
details summary { cursor: pointer; color: var(--muted); }
label.chk { display: flex; gap: 6px; align-items: center; }
#exportWrap { position: relative; }
#exportMenu { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
  width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#exportMenu.open { display: block; }
#exportMenu label { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 0;
  cursor: pointer; align-items: start; }
#exportMenu label input { margin-top: 3px; grid-row: span 2; }
#exportMenu .sub { font-size: 12px; color: var(--muted); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>SAM3 Studio</h1>
  <label class="btn"><span data-i18n="open"></span><input id="file" type="file" hidden
    accept="image/*,video/*,.mkv"></label>
  <details>
    <summary data-i18n="videoOpts"></summary>
    <div class="row" style="margin-top:6px">
      <span class="muted">FPS</span><input id="optFps" type="number" value="10" min="1" max="60">
      <span class="muted" data-i18n="maxWidth"></span><input id="optW" type="number" value="960" step="16">
      <span class="muted" data-i18n="maxFrames"></span><input id="optN" type="number" value="300">
    </div>
  </details>
  <span class="spacer"></span>
  <span id="info" class="muted"></span>
  <div id="exportWrap">
    <button id="exportBtn" disabled><span data-i18n="export"></span> ▾</button>
    <div id="exportMenu">
      <label><input type="checkbox" value="overlay"><span data-i18n="x_overlay"></span>
        <span class="sub" data-i18n="x_overlay_d"></span></label>
      <label><input type="checkbox" value="original"><span data-i18n="x_original"></span>
        <span class="sub" data-i18n="x_original_d"></span></label>
      <label><input type="checkbox" value="matte"><span data-i18n="x_matte"></span>
        <span class="sub" data-i18n="x_matte_d"></span></label>
      <label><input type="checkbox" value="alpha"><span data-i18n="x_alpha"></span>
        <span class="sub" data-i18n="x_alpha_d"></span></label>
      <label><input type="checkbox" value="perobject"><span data-i18n="x_perobject"></span>
        <span class="sub" data-i18n="x_perobject_d"></span></label>
      <div class="hint" style="margin:6px 0 10px" data-i18n="x_note"></div>
      <button id="exportGo" class="primary" style="width:100%" data-i18n="x_go"></button>
    </div>
  </div>
  <button id="folderBtn" data-i18n="folder"></button>
  <select id="lang" aria-label="Language">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>
</header>

<main>
  <section id="stageWrap">
    <div id="stage">
      <div id="drop">
        <div style="font-size:18px" data-i18n="dropTitle"></div>
        <div data-i18n-html="dropSub"></div>
      </div>
      <canvas id="canvas"></canvas>
      <div id="busy"><span id="busyText"></span><div id="bar"><div></div></div></div>
    </div>
    <div id="player">
      <button id="playBtn">▶</button>
      <input id="seek" type="range" min="0" value="0">
      <span id="frameLbl" class="muted"></span>
    </div>
  </section>

  <aside>
    <div>
      <h2 data-i18n="textTitle"></h2>
      <div class="row">
        <input id="text" type="text" placeholder="person, car, horse…" style="flex:1">
        <button id="textBtn" class="primary" data-i18n="segment"></button>
      </div>
      <div class="hint" style="margin-top:6px"><span data-i18n="textHint"></span>
        <b id="textHintMode"></b></div>
      <div class="row" id="thRow" style="margin-top:8px">
        <span class="muted" data-i18n="threshold"></span>
        <input id="th" type="range" min="0.1" max="0.9" step="0.05" value="0.5" style="flex:1">
        <span id="thv">0.50</span>
      </div>
    </div>

    <div>
      <h2 data-i18n="toolsTitle"></h2>
      <div class="row tools">
        <button data-tool="click" title="C" data-i18n="toolClick"></button>
        <button data-tool="box" title="B" data-i18n="toolBox"></button>
      </div>
      <label class="chk hint" id="similarRow" style="margin-top:8px">
        <input id="similar" type="checkbox"> <span data-i18n="similar"></span></label>
      <div class="hint" id="toolHint" style="margin-top:6px"></div>
    </div>

    <div>
      <h2 data-i18n="countTitle"></h2>
      <div class="row" style="align-items:baseline">
        <div id="count">0</div><div class="muted" id="countLbl"></div>
      </div>
      <div class="counts" id="counts" style="margin-top:8px"></div>
    </div>

    <div>
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0" data-i18n="objectsTitle"></h2>
        <button id="clearBtn" style="font-size:12px;padding:3px 8px" data-i18n="clearAll"></button>
      </div>
      <div id="objects" style="margin-top:8px"></div>
    </div>

    <div class="hint" data-i18n-html="keys"></div>
  </aside>
</main>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script>
// ------------------------------------------------------------------ textos
const I18N = {
  es: {
    open: 'Abrir imagen o vídeo', videoOpts: 'Opciones de vídeo', maxWidth: 'Ancho máx.',
    maxFrames: 'Máx. fotogramas', export: 'Exportar', folder: '📂 Exportados',
    dropTitle: 'Arrastra aquí una imagen o un vídeo',
    dropSub: 'Luego haz clic sobre algo, dibuja una caja o escribe qué buscar (p. ej. <b>person</b>, <b>car</b>, <b>horse</b>)',
    textTitle: 'Buscar por texto', segment: 'Segmentar',
    textHint: 'Funciona mejor en inglés.',
    textHintImage: 'Separa varias clases con comas: dog, person, car.',
    textHintVideo: 'En vídeo: una sola clase cada vez, y un texto nuevo empieza de cero.',
    threshold: 'Umbral', toolsTitle: 'Herramientas',
    toolClick: '👆 Clic', toolBox: '▭ Caja',
    similar: 'Caja: buscar todos los parecidos',
    hintClick: 'Clic sobre algo sin máscara → lo añade. Clic sobre una máscara → la quita. Si coge solo una parte: Alt+clic en lo que falta lo añade, Mayús+clic en lo que sobra lo quita.',
    hintClickVideo: ' En vídeo, añadir o corregir recorre todo el vídeo (tarda); quitar es instantáneo.',
    hintBox: 'Arrastra un rectángulo alrededor de un objeto.',
    hintBoxVideo: ' Se seguirá en todos los fotogramas.',
    countTitle: 'Recuento', countImage: 'objetos', countVideo: (n) => `en este fotograma · ${n} en total`,
    objectsTitle: 'Objetos', clearAll: 'Borrar todo', none: 'Todavía no hay objetos.',
    goFirst: 'Ir al primer fotograma', toggle: 'Ocultar / mostrar', remove: 'Quitar',
    keys: '<kbd>C</kbd> clic · <kbd>B</kbd> caja · <kbd>Espacio</kbd> reproducir · <kbd>←</kbd><kbd>→</kbd> fotograma · <kbd>H</kbd> ocultar máscaras',
    infoVideo: (s) => `${s.width}×${s.height} · ${s.n_frames} fotogramas a ${s.fps} fps`,
    loading: 'Cargando…', extracting: 'Extrayendo fotogramas…',
    st_starting: 'Iniciando…', st_preparing: 'Preparando seguimiento…', st_segmenting: 'Segmentando…',
    st_tracking: (f, n) => `Siguiendo objetos · fotograma ${f} / ${n}`,
    st_exporting: (f, n) => `Exportando · fotograma ${f} / ${n}`, st_encoding: 'Creando el vídeo…',
    st_working: 'Procesando…',
    saved: (p) => `Guardado en «videos exportados/${p}»`, show: 'Abrir carpeta',
    x_overlay: 'Vídeo con máscaras pintadas', x_overlay_d: 'Para ver o compartir (.mp4)',
    x_original: 'Vídeo original sin máscaras', x_original_d: 'Mismos fotogramas que las máscaras, para que encajen (.mp4)',
    x_matte: 'Máscara en blanco y negro', x_matte_d: 'Todos los objetos en blanco sobre negro. Para usar como máscara en Final Cut (ProRes .mov)',
    x_alpha: 'Máscaras en color con transparencia', x_alpha_d: 'Solo las máscaras, con fondo transparente, para ponerlas encima del vídeo (ProRes 4444 .mov)',
    x_perobject: 'Una máscara por objeto', x_perobject_d: 'Un archivo blanco y negro por cada objeto, para colorear cada uno por separado (ProRes .mov)',
    x_note: 'Con una imagen se exporta todo en PNG (la máscara en blanco y negro, la de color con transparencia y una por objeto). Los objetos ocultos (◌) no se exportan. Para que encajen con tu vídeo original en Final Cut, ábrelo con sus FPS reales (Opciones de vídeo).',
    x_go: 'Exportar seleccionados', x_none: 'Marca al menos una opción',
    e_busy: 'Ya hay un proceso en marcha', e_nofile: 'Abre primero una imagen o un vídeo',
    e_oneclass: 'En vídeo osam sigue una sola clase cada vez (p. ej. solo «person»)',
    e_noobjects: 'No hay objetos seguidos', e_format: 'Formato no soportado',
    e_noframes: 'No se pudieron extraer fotogramas', e_nofix: 'No hay ningún objeto que corregir',
    l_box: 'caja', l_point: 'clic', l_similar: 'parecido',
  },
  en: {
    open: 'Open image or video', videoOpts: 'Video options', maxWidth: 'Max width',
    maxFrames: 'Max frames', export: 'Export', folder: '📂 Exports',
    dropTitle: 'Drop an image or a video here',
    dropSub: 'Then click on something, draw a box, or type what to find (e.g. <b>person</b>, <b>car</b>, <b>horse</b>)',
    textTitle: 'Find by text', segment: 'Segment',
    textHint: 'Works best in English.',
    textHintImage: 'Separate several classes with commas: dog, person, car.',
    textHintVideo: 'In video: one class at a time, and new text starts over.',
    threshold: 'Threshold', toolsTitle: 'Tools',
    toolClick: '👆 Click', toolBox: '▭ Box',
    similar: 'Box: find all similar objects',
    hintClick: 'Click on something unmasked → adds it. Click on a mask → removes it. If it only grabs part: Alt+click what is missing to add it, Shift+click what is extra to remove it.',
    hintClickVideo: ' In video, adding or correcting runs through the whole video (slow); removing is instant.',
    hintBox: 'Drag a rectangle around an object.',
    hintBoxVideo: ' It will be tracked through every frame.',
    countTitle: 'Count', countImage: 'objects', countVideo: (n) => `in this frame · ${n} total`,
    objectsTitle: 'Objects', clearAll: 'Clear all', none: 'No objects yet.',
    goFirst: 'Go to first frame', toggle: 'Hide / show', remove: 'Remove',
    keys: '<kbd>C</kbd> click · <kbd>B</kbd> box · <kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>H</kbd> hide masks',
    infoVideo: (s) => `${s.width}×${s.height} · ${s.n_frames} frames at ${s.fps} fps`,
    loading: 'Loading…', extracting: 'Extracting frames…',
    st_starting: 'Starting…', st_preparing: 'Preparing tracking…', st_segmenting: 'Segmenting…',
    st_tracking: (f, n) => `Tracking objects · frame ${f} / ${n}`,
    st_exporting: (f, n) => `Exporting · frame ${f} / ${n}`, st_encoding: 'Encoding video…',
    st_working: 'Working…',
    saved: (p) => `Saved to "videos exportados/${p}"`, show: 'Open folder',
    x_overlay: 'Video with painted masks', x_overlay_d: 'To watch or share (.mp4)',
    x_original: 'Original video without masks', x_original_d: 'Same frames as the masks, so they line up (.mp4)',
    x_matte: 'Black & white matte', x_matte_d: 'All objects white on black. Use as a mask in Final Cut (ProRes .mov)',
    x_alpha: 'Colored masks with transparency', x_alpha_d: 'Masks only, on a transparent background, to lay over the video (ProRes 4444 .mov)',
    x_perobject: 'One matte per object', x_perobject_d: 'One black & white file per object, to color each separately (ProRes .mov)',
    x_note: 'With an image everything is exported as PNG (B/W matte, color with transparency, one per object). Hidden objects (◌) are not exported. To line up with your original video in Final Cut, open it at its real FPS (Video options).',
    x_go: 'Export selected', x_none: 'Tick at least one option',
    e_busy: 'Another task is running', e_nofile: 'Open an image or a video first',
    e_oneclass: 'In video osam tracks one class at a time (e.g. just "person")',
    e_noobjects: 'No tracked objects', e_format: 'Unsupported format',
    e_noframes: 'Could not extract frames', e_nofix: 'No object to correct',
    l_box: 'box', l_point: 'click', l_similar: 'similar',
  },
};
let LANG = (() => {
  try { const v = localStorage.getItem('sam3studio.lang'); if (v === 'es' || v === 'en') return v; } catch {}
  return (navigator.language || 'es').startsWith('es') ? 'es' : 'en';
})();
const t = (k, ...a) => { const v = I18N[LANG][k] ?? I18N.en[k] ?? k; return typeof v === 'function' ? v(...a) : v; };
const labelName = (l) => l && l.startsWith('@') ? t('l_' + l.slice(1)) : l;

function applyLang() {
  document.documentElement.lang = LANG;
  $('#lang').value = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $('#exportBtn').title = '';
  updateModeTexts(); renderSide(); if (st) render();
}

// ------------------------------------------------------------------ estado
const $ = (s) => document.querySelector(s);
const canvas = $('#canvas'), ctx = canvas.getContext('2d');
let PALETTE = [];
let st = null;
let cur = 0;
let tool = 'click';
let playing = false;
let showMasks = true;
const hidden = new Set();
const frameImgs = new Map();
const maskCache = new Map();
let hoverId = null;
let drag = null;

function toast(msg, ok = false, btn = null) {
  const el = $('#toast'); $('#toastMsg').textContent = msg;
  el.classList.toggle('ok', ok); el.style.display = 'flex';
  const b = $('#toastBtn'); b.hidden = !btn;
  if (btn) { b.textContent = btn.label; b.onclick = btn.onclick; }
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', ok ? 9000 : 6000);
}
function color(id, a = 1) { const [r, g, b] = PALETTE[id % PALETTE.length]; return `rgba(${r},${g},${b},${a})`; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.code && I18N[LANG]['e_' + j.code] ? t('e_' + j.code) : (j.error || r.statusText));
  return j;
}

function updateModeTexts() {
  const vid = st?.kind === 'video';
  $('#textHintMode').textContent = st ? t(vid ? 'textHintVideo' : 'textHintImage') : '';
  $('#thRow').style.display = vid ? 'none' : 'flex';
  $('#similarRow').style.display = vid ? 'none' : 'flex';
  $('#toolHint').textContent = tool === 'click'
    ? t('hintClick') + (vid ? t('hintClickVideo') : '')
    : t('hintBox') + (vid ? t('hintBoxVideo') : '');
  $('#info').textContent = !st ? '' : vid ? t('infoVideo', st) : `${st.width}×${st.height}`;
}

// -------------------------------------------------------------------- carga
function showSession() {
  canvas.width = st.width; canvas.height = st.height;
  canvas.style.display = 'block'; $('#drop').style.display = 'none';
  const vid = st.kind === 'video';
  $('#player').style.display = vid ? 'flex' : 'none';
  $('#seek').max = st.n_frames - 1; $('#seek').value = cur;
  $('#exportBtn').disabled = false;
  updateModeTexts();
}

async function upload(file) {
  if (!file) return;
  stop();
  const q = new URLSearchParams({ name: file.name, fps: $('#optFps').value,
    max_width: $('#optW').value, max_frames: $('#optN').value });
  showBusy(t(file.type.startsWith('video') ? 'extracting' : 'loading'));
  try { st = await api('/api/upload?' + q, { method: 'POST', body: file }); }
  catch (e) { hideBusy(); return toast(e.message); }
  hideBusy();
  frameImgs.clear(); maskCache.clear(); hidden.clear();
  cur = 0; showSession(); render(); renderSide();
}

function frameImg(i) {
  if (!frameImgs.has(i)) {
    const img = new Image();
    img.src = `/api/frame/${st.sid}/${i}.jpg`;
    frameImgs.set(i, img.decode().then(() => img));
  }
  return frameImgs.get(i);
}

function maskOf(i) {
  const fo = st.frame_objs[i] || [];
  if (!fo.length) return Promise.resolve(null);
  const key = `${st.sid}:${st.version}:${i}`;
  if (!maskCache.has(key)) {
    const p = fetch(`/api/mask/${st.sid}/${st.version}/${i}.png`)
      .then(r => r.blob())
      .then(b => createImageBitmap(b, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' }))
      .then(bmp => {
        const oc = new OffscreenCanvas(bmp.width, bmp.height);
        const c = oc.getContext('2d', { willReadFrequently: true });
        c.drawImage(bmp, 0, 0);
        const d = c.getImageData(0, 0, bmp.width, bmp.height).data;
        const ids = new Uint16Array(bmp.width * bmp.height);
        for (let p = 0, q = 0; q < ids.length; p += 4, q++) ids[q] = d[p] | (d[p + 1] << 8);
        return ids;
      });
    maskCache.set(key, p);
    if (maskCache.size > 80) maskCache.delete(maskCache.keys().next().value);
  }
  return maskCache.get(key);
}

// ------------------------------------------------------------------- dibujo
let renderToken = 0;
async function render() {
  if (!st || !st.sid) return;
  const tok = ++renderToken;
  const i = cur;
  const [img, ids] = await Promise.all([frameImg(i), maskOf(i)]);
  if (tok !== renderToken) return;
  ctx.drawImage(img, 0, 0);
  if (ids && showMasks) {
    const W = canvas.width, H = canvas.height;
    const over = ctx.createImageData(W, H), o = over.data;
    for (let q = 0, p = 0; q < ids.length; q++, p += 4) {
      const v = ids[q]; if (!v) continue;
      const id = v - 1; if (hidden.has(id)) continue;
      const c = PALETTE[id % PALETTE.length];
      o[p] = c[0]; o[p + 1] = c[1]; o[p + 2] = c[2]; o[p + 3] = id === hoverId ? 200 : 130;
    }
    const oc = new OffscreenCanvas(W, H); oc.getContext('2d').putImageData(over, 0, 0);
    ctx.drawImage(oc, 0, 0);
    const lw = Math.max(2, W / 500), fs = Math.max(12, Math.round(W / 70));
    ctx.font = `600 ${fs}px -apple-system, sans-serif`;
    for (const f of st.frame_objs[i] || []) {
      if (hidden.has(f.id) || !f.bbox) continue;
      const [x0, y0, x1, y1] = f.bbox, ob = objById(f.id);
      ctx.strokeStyle = color(f.id); ctx.lineWidth = f.id === hoverId ? lw * 2 : lw;
      ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      const tag = `#${f.id} ${ob ? labelName(ob.label) : ''}${f.score != null ? ' ' + f.score.toFixed(2) : ''}`;
      const tw = ctx.measureText(tag).width + 10;
      ctx.fillStyle = color(f.id); ctx.fillRect(x0, Math.max(0, y0 - fs - 6), tw, fs + 6);
      ctx.fillStyle = '#000'; ctx.fillText(tag, x0 + 5, Math.max(fs, y0 - 5));
    }
  }
  if (drag && drag.x1 != null) {
    ctx.setLineDash([8, 6]); ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, canvas.width / 500);
    ctx.strokeRect(drag.x0, drag.y0, drag.x1 - drag.x0, drag.y1 - drag.y0); ctx.setLineDash([]);
  }
  $('#frameLbl').textContent = `${i + 1} / ${st.n_frames}`;
  renderCounts();
}

function objById(id) { return st?.objects.find(o => o.id === id); }

function renderCounts() {
  if (!st) { $('#count').textContent = 0; $('#countLbl').textContent = t('countImage'); $('#counts').innerHTML = ''; return; }
  const fo = (st.frame_objs[cur] || []).filter(f => !hidden.has(f.id));
  $('#count').textContent = fo.length;
  $('#countLbl').textContent = st.kind === 'video' ? t('countVideo', st.objects.length) : t('countImage');
  const by = {};
  for (const f of fo) { const l = labelName(objById(f.id)?.label) || '?'; by[l] = (by[l] || 0) + 1; }
  $('#counts').innerHTML = Object.entries(by)
    .map(([l, n]) => `<div><span>${esc(l)}</span><b>${n}</b></div>`).join('');
  const present = new Set(fo.map(f => f.id));
  document.querySelectorAll('.obj').forEach(el => el.classList.toggle('absent', !present.has(+el.dataset.id)));
}

function renderSide() {
  const box = $('#objects');
  if (!st || !st.objects.length) { box.innerHTML = `<div class="hint">${t('none')}</div>`; renderCounts(); return; }
  const vid = st.kind === 'video';
  box.innerHTML = st.objects.map(o => `
    <div class="obj ${hidden.has(o.id) ? 'hidden' : ''}" data-id="${o.id}">
      <span class="sw" style="background:${color(o.id)}"></span>
      <span class="name">#${o.id} ${esc(labelName(o.label))}
        ${vid ? `<span class="muted"> · ${o.first + 1}–${o.last + 1}</span>` : ''}</span>
      ${vid ? `<button data-act="go" title="${t('goFirst')}">↦</button>` : ''}
      <button data-act="eye" title="${t('toggle')}">${hidden.has(o.id) ? '◌' : '◉'}</button>
      <button data-act="del" title="${t('remove')}">✕</button>
    </div>`).join('');
  renderCounts();
}

$('#objects').addEventListener('click', (e) => {
  const b = e.target.closest('button'), row = e.target.closest('.obj');
  if (!b || !row) return;
  const id = +row.dataset.id;
  if (b.dataset.act === 'eye') { hidden.has(id) ? hidden.delete(id) : hidden.add(id); renderSide(); render(); }
  if (b.dataset.act === 'del') send({ kind: 'remove', id });
  if (b.dataset.act === 'go') seek(objById(id).first);
});
$('#objects').addEventListener('mouseover', (e) => {
  const row = e.target.closest('.obj'); const id = row ? +row.dataset.id : null;
  if (id !== hoverId) { hoverId = id; render(); }
});
$('#objects').addEventListener('mouseleave', () => { hoverId = null; render(); });

// ----------------------------------------------------------------- acciones
async function send(body) {
  if (!st || !st.sid) return toast(t('e_nofile'));
  stop();
  body.frame = cur;
  try { await api('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch (e) { return toast(e.message); }
  await poll();
}

async function poll() {
  for (;;) {
    let s;
    try { s = await api('/api/state'); } catch { await new Promise(r => setTimeout(r, 1000)); continue; }
    if (s.busy) {
      const p = s.progress || {};
      let txt = t('st_' + (p.stage || 'working')), pct = null;
      if ((p.stage === 'tracking' || p.stage === 'exporting') && p.total) {
        if (p.frame == null) txt = t('st_preparing');
        else { txt = t('st_' + p.stage, p.frame + 1, p.total); pct = (p.frame + 1) / p.total; }
      }
      if (typeof txt !== 'string') txt = t('st_working');
      showBusy(txt, pct);
      await new Promise(r => setTimeout(r, 350));
      continue;
    }
    hideBusy();
    const changed = !st || s.version !== st.version || s.sid !== st.sid;
    st = s;
    if (s.error) toast(s.error);
    else if (s.job === 'export' && s.export_path && s.export_path !== poll.lastExport) {
      poll.lastExport = s.export_path;
      toast(t('saved', s.export_path.split('/').pop()), true,
        { label: t('show'), onclick: () => fetch('/api/open_exports', { method: 'POST' }) });
    }
    for (const id of [...hidden]) if (!objById(id)) hidden.delete(id);
    if (changed) { renderSide(); render(); }
    return;
  }
}

function showBusy(txt, pct) {
  $('#busy').style.display = 'block'; $('#busyText').textContent = txt;
  $('#bar > div').style.width = pct == null ? '100%' : `${Math.round(pct * 100)}%`;
  $('#bar > div').style.opacity = pct == null ? .35 : 1;
}
function hideBusy() { $('#busy').style.display = 'none'; }

const threshold = () => +$('#th').value;
$('#th').oninput = () => $('#thv').textContent = threshold().toFixed(2);
$('#textBtn').onclick = () => {
  const v = $('#text').value.trim(); if (!v) return $('#text').focus();
  send({ kind: 'text', text: v, threshold: threshold() });
};
$('#text').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#textBtn').click(); });
$('#clearBtn').onclick = () => { if (st?.sid) send({ kind: 'clear' }); };
// Menú de exportación: recuerda lo marcado
const exportChecks = () => [...document.querySelectorAll('#exportMenu input[type=checkbox]')];
(() => {
  let saved = ['overlay'];
  try { saved = JSON.parse(localStorage.getItem('sam3studio.export')) || saved; } catch {}
  exportChecks().forEach(c => c.checked = saved.includes(c.value));
})();
exportChecks().forEach(c => c.onchange = () => {
  try { localStorage.setItem('sam3studio.export', JSON.stringify(exportChecks().filter(x => x.checked).map(x => x.value))); } catch {}
});
$('#exportBtn').onclick = (e) => { e.stopPropagation(); $('#exportMenu').classList.toggle('open'); };
$('#exportMenu').onclick = (e) => e.stopPropagation();
document.addEventListener('click', () => $('#exportMenu').classList.remove('open'));
$('#exportGo').onclick = () => {
  const kinds = exportChecks().filter(c => c.checked).map(c => c.value);
  if (!kinds.length) return toast(t('x_none'));
  $('#exportMenu').classList.remove('open');
  send({ kind: 'export', hidden: [...hidden], kinds });
};
$('#folderBtn').onclick = () => fetch('/api/open_exports', { method: 'POST' });
$('#lang').onchange = (e) => {
  LANG = e.target.value;
  try { localStorage.setItem('sam3studio.lang', LANG); } catch {}
  applyLang();
};

function setTool(tl) {
  tool = tl;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tl));
  updateModeTexts();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));

// ------------------------------------------------------------------- lienzo
function toFrame(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) * canvas.width / r.width);
  const y = Math.round((e.clientY - r.top) * canvas.height / r.height);
  return [Math.max(0, Math.min(canvas.width - 1, x)), Math.max(0, Math.min(canvas.height - 1, y))];
}
async function idAt(x, y) {
  const ids = await maskOf(cur); if (!ids) return null;
  const v = ids[y * canvas.width + x]; if (!v) return null;
  const id = v - 1; return hidden.has(id) ? null : id;
}

canvas.addEventListener('mousedown', (e) => {
  if (!st || tool !== 'box') return;
  const [x, y] = toFrame(e); drag = { x0: x, y0: y };
});
canvas.addEventListener('mousemove', async (e) => {
  if (!st) return;
  const [x, y] = toFrame(e);
  if (drag) { drag.x1 = x; drag.y1 = y; render(); return; }
  if (tool === 'click') {
    const id = await idAt(x, y);
    canvas.style.cursor = id == null ? 'crosshair' : (e.shiftKey || e.altKey ? 'cell' : 'pointer');
    if (id !== hoverId) { hoverId = id; render(); }
  }
});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.x1 == null || Math.abs(d.x1 - d.x0) < 5 || Math.abs(d.y1 - d.y0) < 5) { render(); return; }
  const box = [Math.min(d.x0, d.x1), Math.min(d.y0, d.y1), Math.max(d.x0, d.x1), Math.max(d.y0, d.y1)];
  send({ kind: 'box', box, similar: $('#similar').checked, threshold: threshold() });
});
canvas.addEventListener('click', async (e) => {
  if (!st || tool !== 'click') return;
  const [x, y] = toFrame(e);
  const id = await idAt(x, y);
  if (e.shiftKey || e.altKey) {
    const target = id ?? nearest(x, y);
    if (target == null) return toast(t('e_nofix'));
    return send({ kind: 'refine', id: target, point: [x, y], label: e.altKey ? 1 : 0 });
  }
  hoverId = null;
  if (id != null) send({ kind: 'remove', id });       // sobre una máscara: quitar
  else send({ kind: 'point', point: [x, y] });         // fuera: añadir
});
canvas.addEventListener('mouseleave', () => { if (hoverId != null) { hoverId = null; render(); } });

function nearest(x, y) {
  let best = null, bd = Infinity;
  for (const f of st.frame_objs[cur] || []) {
    if (!f.bbox || hidden.has(f.id)) continue;
    const [x0, y0, x1, y1] = f.bbox;
    const dx = Math.max(x0 - x, 0, x - x1), dy = Math.max(y0 - y, 0, y - y1), d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = f.id; }
  }
  return best;
}

// -------------------------------------------------------------- reproductor
function seek(i) { cur = Math.max(0, Math.min(st.n_frames - 1, i)); $('#seek').value = cur; render(); }
$('#seek').oninput = (e) => { stop(); seek(+e.target.value); };
$('#playBtn').onclick = () => playing ? stop() : play();
function stop() { playing = false; $('#playBtn').textContent = '▶'; }
async function play() {
  if (!st || st.kind !== 'video') return;
  playing = true; $('#playBtn').textContent = '❚❚';
  if (cur >= st.n_frames - 1) cur = 0;
  while (playing) {
    const t0 = performance.now();
    for (let k = 1; k <= 4; k++) if (cur + k < st.n_frames) { frameImg(cur + k); maskOf(cur + k); }
    await render();
    if (cur >= st.n_frames - 1) { stop(); break; }
    const wait = 1000 / st.fps - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    if (!playing) break;
    cur++; $('#seek').value = cur;
  }
}

// ------------------------------------------------------------------ teclado
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'b') setTool('box');
  else if (k === 'c' || k === 'p') setTool('click');
  else if (k === 'h') { showMasks = !showMasks; render(); }
  else if (k === ' ' && st?.kind === 'video') { e.preventDefault(); playing ? stop() : play(); }
  else if (k === 'arrowright' && st?.sid) { stop(); seek(cur + 1); }
  else if (k === 'arrowleft' && st?.sid) { stop(); seek(cur - 1); }
});

// --------------------------------------------------------------- arrastrar
$('#file').onchange = (e) => upload(e.target.files[0]);
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, (e) => { e.preventDefault(); $('#drop').classList.add('hover'); }));
document.addEventListener('dragleave', () => $('#drop').classList.remove('hover'));
document.addEventListener('drop', (e) => { e.preventDefault(); $('#drop').classList.remove('hover'); upload(e.dataTransfer.files[0]); });

// ------------------------------------------------------------------- inicio
(async () => {
  PALETTE = await api('/api/palette');
  setTool('click');
  applyLang();
  const s = await api('/api/state');
  if (s.sid) {
    st = s; poll.lastExport = s.export_path; showSession();
    if (s.busy) await poll();
    renderSide(); render();
  }
})();
</script>
